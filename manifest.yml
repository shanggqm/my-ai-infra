  asset_management: assets/README.md
  cli: bin/my-ai-infra.mjs
  core: src/
  web: web/
  design_system: design-system/
  templates: templates/
  specifications: templates/mai-specs/
  bundled_skills: assets/skills/
  workflow_usage: docs/workflow-skills.md
  agent_assets: assets/agents/
