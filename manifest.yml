name: my-ai-infra
package_name: "@easyuseai/my-ai-infra"
license: MIT
version: 0.0.14
status: release-candidate
purpose: Lightweight SDD scaffolding for enterprise AI coding, with reusable assets and persistent development preferences
repository:
  url: https://github.com/shanggqm/my-ai-infra
  visibility: public
source:
