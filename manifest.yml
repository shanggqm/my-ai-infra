  project_config: .my-ai-infra.json
  specifications_root: mai-specs/
  project_state: .my-ai-infra/state.json
  project_source: .agents/
  adapter_strategy: relative-file-symlinks
  managed_state_version: 4
  project_runtime_rules: .agents/rules/
  bundle_baseline: ~/.my-ai-infra/bundle-state.json
  tools:
  - codex
  - claudecode
  - cursor
  - copilot
